name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: 'false'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare bundled web app
        run: npm run build:web
      - name: Generate Android project
        run: npx cap add android
      - name: Verify generated Android template
        run: |
          grep -R "com.android.tools.build:gradle:9.4.1" android/build.gradle
          grep "gradle-9.8.2" android/gradle/wrapper/gradle-wrapper.properties
      - name: Synchronize Capacitor assets
        run: npx cap sync android
      - name: Verify toolchain
        run: |
          java -version
          node --version
          npm --version
          javac -version
          test "$(javac -version 2>&1 | awk '{print $2}' | cut -d. -f1)" -ge 25
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleDebug --no-daemon --warning-mode all
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v6
        with:
          name: Messaging-Application-Reviewer-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
